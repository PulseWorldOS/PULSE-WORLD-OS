# ============================================================================
# GLOBAL SECURITY & CORS HEADERS (applied to all routes by default)
# ============================================================================
# ⚡ FIX: This block MUST include Allow-Headers + Allow-Methods so that
#        preflight OPTIONS requests (which browsers send before any
#        cross-origin fetch with headers like `accept`, `content-type`,
#        `authorization`, etc.) are NOT blocked by the browser.
#        Without these, Netlify returns an empty preflight response and
#        the browser raises:  "Request header field X is not allowed by
#        Access-Control-Allow-Headers in preflight response."
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "cross-origin"
    Timing-Allow-Origin          = "*"
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "Accept, Accept-Language, Accept-Encoding, Authorization, Cache-Control, Content-Type, Content-Length, DNT, If-Modified-Since, Keep-Alive, Origin, Pragma, Range, Referer, User-Agent, X-Requested-With, X-HTTP-Method-Override, x-pulse-mode"
    Access-Control-Max-Age       = "86400"


# ============================================================================
# ⚡ PULSE-PORT: Open CORS for PulseOSSpeed.js  (port.serviceworker.net)
# ============================================================================
[[headers]]
  for = "/PULSE-PORT/PulseOSSpeed.js"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Type                 = "application/javascript; charset=utf-8"

