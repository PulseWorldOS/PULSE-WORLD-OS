# ============================================================================
# ⚡ MULTI-DOMAIN ASSET & CONFIG OPEN CORS (for failover & mirrors)
# ============================================================================
[[headers]]
  for = "/_EXPRESSIONS/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/PULSEConfig/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/PULSE-MULTIVERSE/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

# ============================================================================
# ⚡ NETLIFY FUNCTIONS OPEN CORS & PREFLIGHT HEADERS
# ============================================================================
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "Accept, Accept-Language, Accept-Encoding, Authorization, Cache-Control, Content-Type, Content-Length, DNT, If-Modified-Since, Keep-Alive, Origin, Pragma, Range, Referer, User-Agent, X-Requested-With, X-HTTP-Method-Override, x-pulse-mode"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Max-Age       = "86400"

[build]
  publish = "PULSE-MULTIVERSE"
  functions = "PULSE-SERVER/NETLIFY"

# Prewarm function (runs every minute)
[functions."PULSEWORLDNET-PREWARM"]
  schedule = "* * * * *"

# Route: Make FILES.PULSEWORLD.NET serve the _EXPRESSIONS folder
[[redirects]]
  from = "https://files.pulseworld.net/*"
  to = "https://www.pulseworld.net/:splat"
  status = 200
  force = true

