<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PulseBrowser OS Console</title>
  <!-- Preload Logo -->
  <link rel="preload" as="image" href="PulseBrowserConsole.png" />

  <style>
    body {
      color: #00FF9C;
      border-radius: 40px;
      background: url("PulseBrowserConsole.png") center top / contain no-repeat;
      font-family: monospace;
      padding: 10px;
      width: 290px;
      height: 550px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #00FF9C;
      text-align: center;
    }

    .section {
      margin-top: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00FF9C33;
    }

    .section-title {
      background: #000000;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #FF8844;
    }

    button {
      
      background: #00FF9C;
      border: none;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    button:hover {
      background: #00C87A;
    }

    #output {
      margin-top: 58px;
      font-size: 12px;
      background: #001F1A;
      padding: 6px;
      border-radius: 40px;
      height: 118px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <!-- ========================= -->
  <!-- OUTPUT -->
  <!-- ========================= -->
  <pre id="output"></pre>
  <!-- ========================= -->
  <!-- KERNEL -->
  <!-- ========================= -->
  <div class="section">
    <div class="section-title">Kernel</div>
    <button id="btn-ping">Ping Kernel</button>
    <button id="btn-refresh-hud">Refresh HUD</button>
    <button id="btn-site-hud">View Site Stats</button>
  </div>

 
  <!-- ========================= -->
  <!-- NAVIGATION -->
  <!-- ========================= -->
  <div class="section">
    <div class="section-title">Navigation</div>
    <button id="btn-open-pulseworld">Open PulseWorld</button>
    <button id="btn-open-settings">Open Settings Panel</button>
  </div>

  <!-- ========================= -->
  <!-- SETTINGS -->
  <!-- ========================= -->
  <div class="section">
    <div class="section-title">Settings</div>
    <button id="btn-toggle-decode">Toggle PulseDecode</button>
  </div>

  <!-- ========================= -->
  <!-- DEVTOOLS -->
  <!-- ========================= -->
  <div class="section">
    <button id="btn-dev-dump">Full OS Diagnostic Dump</button>
  </div>

  <script src="PBPopup.js"></script>
  <script src="PBSettings.js"></script>
  <script src="PBRealmBridge.js"></script>
  <script src="PBInterceptor.js"></script>
  <script src="PBRouter.js"></script>
</body>
</html>
