<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseBrowser OS Console</title>
  <link rel="preconnect" href="https://www.pulseworld.net" crossorigin>
  <link rel="preconnect" href="https://www.pulseworld.me" crossorigin>
  <link rel="preconnect" href="https://www.pulseworld.biz" crossorigin>
  <link rel="preconnect" href="https://www.pulseworld.money" crossorigin>
  <!-- Preload Logo -->
  <link rel="preload" as="image" href="PulseBrowserConsole.png" />

  <style>
    body {
      margin: 0 auto;
      height: 100vh;
      color: #00FF9C;
      border-radius: 40px;
      background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
      font-family: monospace;
      padding: 10px;
    }

    .bg {
      /* width: 290px;
      height: 550px; */
      margin: 0 auto;
      width: 330px;
      height: 850px;
      background: url("PulseBrowserConsole.png") center top / contain no-repeat;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    a {
      cursor: pointer;
    }

    /* Scrollbar width */
    body::-webkit-scrollbar {
      width: 10px;
    }

    /* Scrollbar track (background) */
    body::-webkit-scrollbar-track {
      background: rgba(0, 40, 50, 0.4);   /* dark teal glass */
      border-radius: 10px;
    }

    /* Scrollbar thumb (the draggable part) */
    body::-webkit-scrollbar-thumb {
      background: #00bcd4;                /* bright teal */
      border-radius: 10px;
      border: 2px solid rgba(0, 40, 50, 0.6); /* inner glow effect */
    }

    /* Scrollbar thumb on hover */
    body::-webkit-scrollbar-thumb:hover {
      background: #00e0ff;                /* lighter teal glow */
    }


    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #00FF9C;
      text-align: center;
    }

    .section {
      margin-top: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00FF9C33;
    }

    .section-title {
      background: #000000;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #FF8844;
    }

    button {
      background: transparent;
      border: 1px solid #0FF;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    button:hover {
      transform: scale(1.03);
    }
    button:active {
      backdrop-filter: blur(2px) brightness(0.85);
      transform: scale(0.92) translateY(1px);
      filter: brightness(0.85);
      box-shadow: 0 0 6px #0ff inset;
    }

    #btn-open-email {
      position: absolute;
      top: 25.3dvh;
      left: 5.8dvw;
      width: 41.6dvw;
      height: 5.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-bank {
      position: absolute;
      top: 25.3dvh;
      right: 5.8dvw;
      width: 41.6dvw;
      height: 5.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-identity {
      position: absolute;
      top: 31dvh;
      left: 5.8dvw;
      width: 41.6dvw;
      height: 5.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-business {
      position: absolute;
      top: 31dvh;
      right: 5.8dvw;
      width: 41.6dvw;
      height: 5.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-settings {
      position: absolute;
      top: 42dvh;
      left: 5.8dvw;
      width: 41.6dvw;
      height: 5.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-modules {
      position: absolute;
      top: 42dvh;
      right: 5.8dvw;
      width: 41.6dvw;
      height: 5.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #output {
      position: absolute;
      top: 0;
      margin-top: 90px;
      margin-left: 12px;
      font-size: 12px;
      background: rgba(0, 20, 30, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 6px;
      border-radius: 40px;
      height: 112px;
      width: 292px;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 0 12px rgba(0, 255, 255, 0.15), 0 0 10px rgba(0, 255, 255, 0.1);
    }

    #modules-popup {
      position: fixed;
      bottom: 0;
      height: 0;
      inset-inline: 0;
      margin-inline: auto;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;

      transition: height 0.35s ease;
      z-index: 9999;
      padding-top: 4px;

      /* ⭐ NEW: turn the popup into a 2-column grid */
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: minmax(20px, auto);
      gap: 8px;
    }


    /* MODULE BUTTONS INSIDE POPUP */
    .module-btn {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: block;
      width: 100%;
      margin: 1px auto;
      padding: 0px;
      background: rgba(0,255,255,0.15);
      border: 1px solid #00FF9C;
      border-radius: 14px;
      color: #00FF9C;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }

    .module-btn:hover {
      transform: scale(1.03);
    }
    .module-btn:active {
      backdrop-filter: blur(2px) brightness(0.85);
      transform: scale(0.92) translateY(1px);
      filter: brightness(0.85);
      box-shadow: 0 0 6px #0ff inset;
    }
    .module-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      object-fit: contain;
      border-radius: 6px;
    }

    .earner-helper-panel {
      position: fixed;
      bottom: 10px;
      height: 250px;
      width: 330px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(24px);
      font-size: 0.8rem;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.45);
      z-index: 5;
    }

    .earner-inner-helper-panel {
      width: 100%;
      height: 100%;
      font-size: 0.8rem;
      justify-content: center;
      align-items: center;
      border-radius: 18px;
      background: var(--pw-console-bg);
      box-shadow:
        0 0 24px rgba(0, 0, 0, 0.85),
        0 0 12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(0, 255, 200, 0.25);
    }

    .CompanionConsoleInputRowMain {
      display: flex;
      width: 200px;
      gap: 8px;
      margin-top: 8px;
    }

    .CompanionConsoleInput {
      flex: 1;
      width: 200px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(5, 7, 12, 0.95);
      color: var(--pw-text);
      font-size: 14px;
      outline: none;
    }

    .consoleOvermindCompanion {
      flex: 1;
      width: 90%;
      margin-top: 30px;
      min-height: 140px;
      max-height: 190px;
      overflow-y: auto;
      padding: 6px;
      border-radius: 10px;
      background: radial-gradient(circle at top, rgba(0, 255, 200, 0.06), rgba(0, 0, 0, 0.95));
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
      font-size: 12px;
    }

    /* BUTTONS */
    .consoleOvermindCompanionSend {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #f5d27a, #c89a3a);
      color: #050608;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow:
        0 0 12px rgba(245, 210, 122, 0.65),
        0 4px 10px rgba(0, 0, 0, 0.6);
    }

    .CompanionTitle {
      margin-bottom: 6px;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.12em;
      color: #0FF;
    }

    #pbPulseDetailsEarn2 {
      z-index: 10;
      cursor: pointer;
      position: absolute;
      width: 25%;
      opacity: 0.25;
      margin-bottom: 20px;
      height: auto;
      border-radius: 99px;
      object-fit: inherit;
      filter: drop-shadow(0 0 10px #00aaffaa);
      animation: pulseGlow 3.5s ease-in-out infinite;
    }

    #pbPulseDetailsEarning2 {
      z-index: 10;
      cursor: pointer;
      position: absolute;
      width: 25%;
      margin-bottom: 20px;
      height: auto;
      border-radius: 99px;
      object-fit: inherit;
      filter: drop-shadow(0 0 10px #00aaffaa);
      animation: bubbleFloatMinionette2 0.5s ease-in-out,
                pulseGlow 3.5s ease-in-out infinite;
    }
    
    @keyframes bubbleFloatMinionette2 {
      0%   { transform: translate(-30px, -12px); }
      8%   { transform: translate(-42px, -32px); }
      20%  { transform: translate(-68px, -54px); }
      24%  { transform: translate(-77px, -61px); }
      48%  { transform: translate(-84px, -71px); }
      64%  { transform: translate(-93px, -81px); }
      80%  { transform: translate(-117px, -91px); }
      100% { transform: translate(-130px, -110px); }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <!-- MODULES POPUP -->
  <div id="modules-popup">
    <div class="module-btn" id="mod-social"><span class="module-icon" id="moduleSocialIcon">🎭</span> SOCIAL</div>
    <div class="module-btn" id="mod-work"><span class="module-icon" id="moduleWorkIcon">💼</span> WORK</div>
    <div class="module-btn" id="mod-stream"><span class="module-icon" id="moduleStreamIcon">📺</span> STREAM</div>
    <div class="module-btn" id="mod-shopping"><span class="module-icon" id="moduleShoppingIcon">💳</span> SHOPPING</div>
    <div class="module-btn" id="mod-1"><span class="module-link" id="mod1">Realm 1</span><span class="module-icon" id="module1">⚡</span></div>
    <div class="module-btn" id="mod-2"><span class="module-link" id="mod2">Realm 2</span><span class="module-icon" id="module2">⚡</span></div>
    <div class="module-btn" id="mod-3"><span class="module-link" id="mod3">Realm 3</span><span class="module-icon" id="module3">⚡</span></div>
    <div class="module-btn" id="mod-4"><span class="module-link" id="mod4">Realm 4</span><span class="module-icon" id="module4">⚡</span></div>
    <div class="module-btn" id="mod-5"><span class="module-link" id="mod5">Realm 5</span><span class="module-icon" id="module5">⚡</span></div>
    <div class="module-btn" id="mod-6"><span class="module-link" id="mod6">Realm 6</span><span class="module-icon" id="module6">⚡</span></div>
  </div>

  <!-- ========================= -->
  <!-- OUTPUT -->
  <!-- ========================= -->
  <pre id="output"></pre>
  <!-- ========================= -->
  <!-- KERNEL -->
  <!-- ========================= -->
  <button id="btn-open-email"></button>
  <button id="btn-open-bank"></button>
  <button id="btn-open-identity"></button>
  <button id="btn-open-business"></button>
  <button id="btn-open-settings"></button>
  <button id="btn-open-modules"></button>

  <div class="earner-helper-panel" id="earner-helper-panel">
    <video id="pbPulseDetailsEarn2" class="pbPulseDetailsEarn2" src="PulseOvermind.mp4" autoplay muted playsinline aria-label="pbPulseDetailsEarn2"></video>
    <div class="earner-inner-helper-panel" id="earner-inner-helper-panel">
      <div style="text-align: center; font-weight:bold; top: 0; text-align: center; border-radius: 40px; padding: 4px 4px; border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(6px); position: absolute; color: #0FF; font-size:13px; margin-top: 2px; margin-bottom: 6px;">
        Pulse Pal - 🧠 AI Overmind (?)
      </div>      
      <div id="consoleOvermindCompanion" class="consoleOvermindCompanion">
        <div id="CompanionTitle" class="CompanionTitle" style="text-align: center;"></div>
      </div>
      <div class="CompanionConsoleInputRow">
        <input id="CompanionConsoleInput" class="CompanionConsoleInput" type="text" placeholder="Just Ask.. (PulsePal Helper)" />
        <button id="consoleOvermindCompanionSend" class="consoleOvermindCompanionSend">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="PBPopup.js"></script>
  <script src="PBSettings.js"></script>
  <script src="PBInterceptor.js"></script>
  <script src="PBRouter.js"></script>
  <script src="PBDevTools.js"></script>

</body>
</html>
