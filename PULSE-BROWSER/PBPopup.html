<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PulseBrowser OS Console</title>
  <!-- Preload Logo -->
  <link rel="preload" as="image" href="PulseBrowserConsole.png" />

  <style>
    body {
      color: #00FF9C;
      border-radius: 40px;
      background: url("PulseBrowserConsole.png") center top / contain no-repeat;
      font-family: monospace;
      padding: 10px;
      width: 290px;
      height: 550px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #00FF9C;
      text-align: center;
    }

    .section {
      margin-top: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00FF9C33;
    }

    .section-title {
      background: #000000;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #FF8844;
    }

    button {
      background: #00FF9C;
      border: none;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    button:hover {
      background: #00C87A;
    }

    .btn-open-email {
      position: fixed;
      top: 33.2dvh;
      left: 1.2dvw;
      width: 46dvw;
      height: 6.2dvh;
      
      border: none;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #output {
      margin-top: 58px;
      font-size: 12px;
      background: transparent;
      padding: 6px;
      border-radius: 40px;
      height: 118px;
      width: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <!-- ========================= -->
  <!-- OUTPUT -->
  <!-- ========================= -->
  <pre id="output"></pre>
  <!-- ========================= -->
  <!-- KERNEL -->
  <!-- ========================= -->
  <button id="btn-open-email"></button>

  <script src="PBPopup.js"></script>
  <script src="PBSettings.js"></script>
  <script src="PBRealmBridge.js"></script>
  <script src="PBInterceptor.js"></script>
  <script src="PBRouter.js"></script>
</body>
</html>
