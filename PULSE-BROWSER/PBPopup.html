<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PulseBrowser OS Console</title>
  <!-- Preload Logo -->
  <link rel="preload" as="image" href="PulseBrowserConsole.png" />

  <style>
    body {
      color: #00FF9C;
      border-radius: 40px;
      background: url("PulseBrowserConsole.png") center top / contain no-repeat;
      font-family: monospace;
      padding: 10px;
      width: 290px;
      height: 550px;
    }

    /* Scrollbar width */
    body::-webkit-scrollbar {
      width: 10px;
    }

    /* Scrollbar track (background) */
    body::-webkit-scrollbar-track {
      background: rgba(0, 40, 50, 0.4);   /* dark teal glass */
      border-radius: 10px;
    }

    /* Scrollbar thumb (the draggable part) */
    body::-webkit-scrollbar-thumb {
      background: #00bcd4;                /* bright teal */
      border-radius: 10px;
      border: 2px solid rgba(0, 40, 50, 0.6); /* inner glow effect */
    }

    /* Scrollbar thumb on hover */
    body::-webkit-scrollbar-thumb:hover {
      background: #00e0ff;                /* lighter teal glow */
    }


    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #00FF9C;
      text-align: center;
    }

    .section {
      margin-top: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00FF9C33;
    }

    .section-title {
      background: #000000;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #FF8844;
    }

    button {
      background: transparent;
      border: 1px solid #0FF;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    button:hover {
      transform: scale(1.03);
    }
    button:active {
      backdrop-filter: blur(2px) brightness(0.85);
      transform: scale(0.92) translateY(1px);
      filter: brightness(0.85);
      box-shadow: 0 0 6px #0ff inset;
    }

    #btn-open-email {
      position: fixed;
      top: 36.3dvh;
      left: 3.7dvw;
      width: 45.6dvw;
      height: 7.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-bank {
      position: fixed;
      top: 36.3dvh;
      right: 3.7dvw;
      width: 45.6dvw;
      height: 7.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-identity {
      position: fixed;
      top: 45dvh;
      left: 3.7dvw;
      width: 45.6dvw;
      height: 7.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-business {
      position: fixed;
      top: 45dvh;
      right: 3.7dvw;
      width: 45.6dvw;
      height: 7.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-settings {
      position: fixed;
      bottom: 30.3dvh;
      left: 3.7dvw;
      width: 45.6dvw;
      height: 7.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #btn-open-modules {
      position: fixed;
      bottom: 30.3dvh;
      right: 3.7dvw;
      width: 45.6dvw;
      height: 7.5dvh;
      
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 14px;
    }

    #output {
      margin-top: 60px;
      margin-left: -6px;
      font-size: 12px;
      background: rgba(0, 20, 30, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 6px;
      border-radius: 40px;
      height: 112px;
      width: 292px;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 0 12px rgba(0, 255, 255, 0.15), 0 0 10px rgba(0, 255, 255, 0.1);
    }

    /* MODULES POPUP PANEL — bottom-up */
    #modules-popup {
      position: absolute;
      right: 18%;        /* anchor to bottom */
      bottom: 0;
      left: 18%;
      width: 64%;
      height: 0;        /* start collapsed */
      overflow: hidden;

      border-top-left-radius: 20px;       /* flipped */
      border-top-right-radius: 20px;

      transition: height 0.35s ease;
      z-index: 9999;
      padding-top: 4px;
    }


    /* MODULE BUTTONS INSIDE POPUP */
    .module-btn {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: block;
      width: 80%;
      margin: 1px auto;
      padding: 0px;
      background: rgba(0,255,255,0.15);
      border: 1px solid #00FF9C;
      border-radius: 14px;
      color: #00FF9C;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
    }

    .module-btn:hover {
      transform: scale(1.03);
    }
    .module-btn:active {
      backdrop-filter: blur(2px) brightness(0.85);
      transform: scale(0.92) translateY(1px);
      filter: brightness(0.85);
      box-shadow: 0 0 6px #0ff inset;
    }
    .module-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      object-fit: contain;
      border-radius: 6px;
    }

    
  </style>
</head>

<body>
  <div class="bg"></div>
  <!-- MODULES POPUP -->
  <div id="modules-popup">
    <div class="module-btn" id="mod-social"><span class="module-icon" id="moduleSocialIcon">🎭</span> Accelerated Social</div>
    <div class="module-btn" id="mod-work"><span class="module-icon" id="moduleWorkIcon">💼</span> Accelerated Work</div>
    <div class="module-btn" id="mod-stream"><span class="module-icon" id="moduleStreamIcon">📺</span> Accelerated Stream</div>
    <div class="module-btn" id="mod-1"><span class="module-link" id="mod1">Accelerated 1</span><span class="module-icon" id="module1">⚡</span></div>
    <div class="module-btn" id="mod-2"><span class="module-link" id="mod2">Accelerated 2</span><span class="module-icon" id="module2">⚡</span></div>
    <div class="module-btn" id="mod-3"><span class="module-link" id="mod3">Accelerated 3</span><span class="module-icon" id="module3">⚡</span></div>
    <div class="module-btn" id="mod-4"><span class="module-link" id="mod4">Accelerated 4</span><span class="module-icon" id="module4">⚡</span></div>
    <div class="module-btn" id="mod-5"><span class="module-link" id="mod5">Accelerated 5</span><span class="module-icon" id="module5">⚡</span></div>
  </div>

  <!-- ========================= -->
  <!-- OUTPUT -->
  <!-- ========================= -->
  <pre id="output"></pre>
  <!-- ========================= -->
  <!-- KERNEL -->
  <!-- ========================= -->
  <button id="btn-open-email"></button>
  <button id="btn-open-bank"></button>
  <button id="btn-open-identity"></button>
  <button id="btn-open-business"></button>
  <button id="btn-open-settings"></button>
  <button id="btn-open-modules"></button>

  <script src="PBPopup.js"></script>
  <script src="PBSettings.js"></script>
  <script src="PBRealmBridge.js"></script>
  <script src="PBInterceptor.js"></script>
  <script src="PBRouter.js"></script>

</body>
</html>
