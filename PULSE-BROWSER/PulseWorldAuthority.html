<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PulseWorld Authority Gateway</title>
<style>
  body {
    margin: 0;
    background: transparent;
    font-family: sans-serif;
  }
  #pulseworld {
    opacity: 1;
    position: fixed;
    /* AUTO-CENTER CONTENT INSIDE */
    display: block;
    margin: 0 auto;
    /* Normal dimensional viewport */
    top: 11dvh;
    left: 9dvw;
    width: calc(100dvw - 20dvw);
    height: calc(100% - 29%);
    /* FIX: allow collapse to override */
    min-width: 0;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 24px;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
    z-index: 9999;
    /* SHADOW + DEPTH */
    box-shadow:
      0 0 22px rgba(0, 255, 255, 0.25),
      inset 0 0 18px rgba(0, 255, 255, 0.08),
      0 0 120px rgba(0, 255, 255, 0.15);
    scrollbar-color: #00eaff #0a0a0a;
    scrollbar-width: thin;
  }
</style>
</head>

<body>
<div id="pulseworld">Loading PulseWorld…</div>
<script src="PulseWorldAuthority.js"></script>

</body>
</html>
