    --t-bg-dark: #05080c;
    --t-metal-light: #d9dde4;
    --t-metal-mid: #9ca3b0;
    --t-metal-dark: #4b515e;
    --t-text-main: #f5f7fb;
    --t-text-subtle: #a7b0c4;
    --t-card-bg: #070a11;
    --bg-alt: #0b1020;
    --accent: #00c8ff;
    --accent-soft: rgba(0, 200, 255, 0.12);
    --accent-strong: rgba(0, 200, 255, 0.35);
    --text: #f5f7ff;
    --muted: #9aa0c2;
    --border: #1b2238;
    --danger: #ff4b81;
    --success: #3dd68c;
    --shadow-soft: 0 24px 60px rgba(0, 0, 0, 0.55);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  body {
    margin: 0 auto;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    inset: 0;
    font-family: system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    color: var(--pulse-gold-strong);
    background-image: url("https://www.pulseworld.net/_EXPRESSIONS/_PEX/BUILD/PulseWorldBarrier-Alpha.webp.pex");
    background-size: cover;
    background-position-x: center;
    touch-action: manipulation;
  }
  html {
    margin: 0 auto;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
    font-family: system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #pulseworld {
    opacity: 1;
    position: fixed;
    /* AUTO-CENTER CONTENT INSIDE */
    display: block;
    margin: 0 auto;
    /* Normal dimensional viewport */
    top: 11dvh;
    left: 9dvw;
    width: calc(100dvw - 20dvw);
    height: calc(100% - 29%);
    /* FIX: allow collapse to override */
    min-width: 0;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 24px;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
    z-index: 9999;
    /* SHADOW + DEPTH */
    box-shadow:
      0 0 22px rgba(0, 255, 255, 0.25),
      inset 0 0 18px rgba(0, 255, 255, 0.08),
      0 0 120px rgba(0, 255, 255, 0.15);
    scrollbar-color: #00eaff #0a0a0a;
    scrollbar-width: thin;
  }
