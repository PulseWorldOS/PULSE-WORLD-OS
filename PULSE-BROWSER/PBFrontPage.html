<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseBrowser OS</title>

  <!-- Preload Logo -->
   
  <link rel="preload" as="image" href="PulseWorldEntrancePulseGPUPulseEarn.png" />
  <link rel="preload" as="image" href="PulseWorldSplash512.png" />

  <style>
    body {
      margin: 0 auto;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    a {
      cursor: pointer;
    }


    .nebula {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url("PulseWorldEntrancePulseGPUPulseEarn.png") center/cover no-repeat;
      filter: brightness(0.55);
      opacity: 0.65;
      animation: drift 40s linear infinite;
      z-index: -3;
    }

    @keyframes drift {
      0% { transform: translate(-5%, -5%) scale(1.05); }
      50% { transform: translate(5%, 5%) scale(1.1); }
      100% { transform: translate(-5%, -5%) scale(1.05); }
    }

    .core {
      text-align: center;
      margin: 0 auto;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
      width: 900px;
      max-width: 90%;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .logo {
      width: 240px;
      height: 240px;
      border-radius: 30px;
      box-shadow: 0 0 40px #00aaff88, 0 0 80px #00aaff44;
      animation: pulseGlow 3.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 40px #00aaff88, 0 0 80px #00aaff44; }
      50% { box-shadow: 0 0 70px #00ccffcc, 0 0 120px #00ccff66; }
      100% { box-shadow: 0 0 40px #00aaff88, 0 0 80px #00aaff44; }
    }

    .title {
      font-size: 2.8rem;
      font-weight: bold;
      margin-top: 25px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px #00aaff;
      animation: titleReveal 1.8s ease forwards;
      opacity: 0;
    }

    @keyframes titleReveal {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .subtitle {
      margin-top: 8px;
      font-size: 1.1rem;
      opacity: 0;
      animation: subtitleReveal 2.5s ease forwards;
      animation-delay: 1.2s;
      text-shadow: 0 0 8px #00aaff88;
    }

    @keyframes subtitleReveal {
      to { opacity: 0.85; }
    }

    /* FIXED BUTTON — now an anchor */
    .search {
      margin-top: 8px;
      padding: 6px 14px;
      background: grey;
      color: black;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      font-weight: bold;
      box-shadow: 0 0 20px #00aaff88;
      transition: 0.25s ease;
      animation: buttonReveal 3s ease forwards;
      opacity: 0;
      text-decoration: none;
      display: inline-block;
    }

    @keyframes buttonReveal {
      to { opacity: 1; }
    }

    .search:hover {
      background: #33bbffcc;
      box-shadow: 0 0 30px #33bbffcc;
      transform: scale(1.05);
    }
    /* FIXED BUTTON — now an anchor */
    .text {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      padding: 2px;
      border-radius: 40px;
      border: 2px solid black;
      background-color: red;
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.3);
      transition: 0.25s ease;
    }
    .videos {
      width: 20px;
      height: 20px;
      margin-right: 2px;
      padding: 2px;
      border-radius: 40px;
      border: 2px solid black;
      background-color: black;
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.3);
      transition: 0.25s ease;
    }
    .images {
      width: 20px;
      height: 20px;
      margin-right: 2px;
      padding: 2px;
      border-radius: 40px;
      border: 2px solid black;
      background-color: black;
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.3);
      transition: 0.25s ease;
    }
    .navigate {
      width: 20px;
      height: 20px;
      display: none;
      margin-right: 2px;
      padding: 2px;
      border-radius: 40px;
      border: 2px solid black;
      background-color: black;
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.3);
      transition: 0.25s ease;
    }
    /* FIXED BUTTON — now an anchor */
    .searchus {
      margin-top: 8px;
      padding: 6px 14px;
      background: grey;
      color: black;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      font-weight: bold;
      box-shadow: 0 0 20px #00aaff88;
      transition: 0.25s ease;
      animation: buttonReveal 3s ease forwards;
      opacity: 0;
      text-decoration: none;
      display: inline-block;
    }

    @keyframes buttonReveal {
      to { opacity: 1; }
    }

    .searchus:hover {
      background: #33bbffcc;
      box-shadow: 0 0 30px #33bbffcc;
      transform: scale(1.05);
    }

    #timerBtn {
      position: fixed;
      z-index: 99999999;
      font-size: 20px;
      font-weight: 600;
      padding: 3px 6px;
      bottom: 1.5dvh;
      right: 1dvw;
      border-radius: 6px;
      border: 1px solid #0ff;
      background: rgba(0,0,0,0.0);
      color: #0ff;
      display: flex;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, 
                  box-shadow 0.12s ease, 
                  filter 0.12s ease,
                  backdrop-filter 0.15s ease;
      backdrop-filter: none;
    }
    #driftBtn:hover {
      transform: scale(1.03);
    }

    /* FIXED BUTTON — now an anchor */
    .enter {
      margin-top: 30px;
      padding: 14px 34px;
      background: linear-gradient(135deg, #000, #0a0a0a);
      color: white;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid white;
      text-decoration: none;
      display: inline-block;

      /* Glow + reveal */
      box-shadow:
        0 0 20px #00aaff88,
        inset 0 0 12px rgba(255,255,255,0.08);
      transition: 0.25s ease;
      animation: buttonReveal 1.8s ease forwards;
      opacity: 0;
      position: relative;
      overflow: hidden;
    }

    /* Fade-in */
    @keyframes buttonReveal {
      to { opacity: 1; }
    }

    /* Gleam sweep */
    .enter::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 120%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255,255,255,0.25) 50%,
        transparent 100%
      );
      transform: skewX(-20deg);
      transition: 0.6s ease;
    }

    /* Hover: gleam + glow + lift */
    .enter:hover {
      background: linear-gradient(135deg, #003300, #005500);
      box-shadow:
        0 0 30px #33bbffcc,
        inset 0 0 18px rgba(255,255,255,0.15);
      transform: scale(1.06);
    }

    .enter:hover::before {
      left: 120%;
    }

    /* FIXED BUTTON — now an anchor */
    .engage {
      height: 23px;
      margin-top: 8px;
      padding: 6px 14px;
      background: green;
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 20px #00aaff88;
      transition: 0.25s ease;
      animation: buttonReveal 3s ease forwards;
      opacity: 0;
      text-decoration: none;
      display: inline-block;
    }

    @keyframes buttonReveal {
      to { opacity: 1; }
    }

    .engage:hover {
      background: #33bbff;
      box-shadow: 0 0 30px #33bbffcc;
      transform: scale(1.05);
    }

    /* FIXED BUTTON — now an anchor */
    .access {
      margin-top: 8px;
      padding: 6px 14px;
      background: green;
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 20px #00aaff88;
      transition: 0.25s ease;
      animation: buttonReveal 3s ease forwards;
      opacity: 0;
      text-decoration: none;
      display: inline-block;
    }

    @keyframes buttonReveal {
      to { opacity: 1; }
    }

    .access:hover {
      background: gold;
      color: black;
      box-shadow: 0 0 30px #33bbffcc;
      transform: scale(1.05);
    }

    /* FIXED BUTTON — now an anchor */
    .setup {
      height: 23px;
      margin-top: 8px;
      padding: 6px 14px;
      background: grey;
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 20px #00aaff88;
      transition: 0.25s ease;
      animation: buttonReveal 3s ease forwards;
      opacity: 0;
      text-decoration: none;
      display: inline-block;
    }

    @keyframes buttonReveal {
      to { opacity: 1; }
    }

    .setup:hover {
      background: gold;
      color: black;
      box-shadow: 0 0 30px #33bbffcc;
      transform: scale(1.05);
    }
    .shimmer {
      position: absolute;
      width: 400%;
      border-radius: 40px;
      height: 400%;
      background: linear-gradient(120deg, transparent 0%, #00aaff22 50%, transparent 100%);
      animation: shimmerMove 6s linear infinite;
      z-index: -2;
    }

    @keyframes shimmerMove {
      0% { transform: translateX(-100%) translateY(-100%); }
      100% { transform: translateX(100%) translateY(100%); }
    }

    .search-engine-textbox {
      min-height: 60px;
      
      width: 600px;
      max-width: 90%;
      background: rgba(10, 10, 10, 0.85);
      color: #eee;

      font-size: 24px;
      font-weight: 500;
      line-height: 1.4;

      padding: 16px 20px;
      border-radius: 12px;

      border: 2px solid #333;
      outline: none;
      
      box-shadow: 0 0 18px rgba(0, 150, 255, 0.25);
      backdrop-filter: blur(4px);

      /* Smooth typing */
      caret-color: #4af;

      /* Allow typing */
      white-space: pre-wrap;
    }

    .search-engine-textbox:focus {
      border-color: #4af;
      box-shadow: 0 0 28px rgba(68, 170, 255, 0.45);
    }

    /* ============================
      SEARCH AREA
      ============================ */

    .search-area {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }


    .navigate:hover,
    .images:hover,
    .videos:hover,
    .text:hover {
      transform: scale(1.15);
      background: rgba(0, 150, 255, 0.4);
      box-shadow: 0 0 18px rgba(0, 150, 255, 0.6);
    }

    /* ============================
      MAIN BUTTON GROUPS
      ============================ */

    .main-links,
    .business-links,
    .identity-links {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 40px;
    }

    /* ============================
      MODULE CONSOLE
      ============================ */

    .module-console {
      margin-top: 25px;
      padding: 20px;
      width: 700px;
      max-width: 90%;

      background: rgba(0, 0, 0, 0.55);
      border: 2px solid #00aaff55;
      border-radius: 16px;

      box-shadow: 0 0 25px rgba(0, 150, 255, 0.25);
      backdrop-filter: blur(6px);

      margin-left: auto;
      margin-right: auto;
    }

    .module-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 16px;
      text-shadow: 0 0 10px #00aaff;
    }

    .module-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .module-btn {
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border-radius: 10px;
      border: 2px solid #00aaff88;

      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;

      box-shadow: 0 0 12px rgba(0, 150, 255, 0.3);
      transition: 0.25s ease;
    }

    .module-btn:hover {
      background: #003344;
      box-shadow: 0 0 22px rgba(0, 150, 255, 0.6);
      transform: scale(1.08);
    }
    .module-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: #1a1a1d;
      border: 1px solid #333;
      border-radius: 10px;
      color: #eee;
      text-decoration: none;
      font-size: 18px;
    }

    .module-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }

    .module-label {
      font-size: 18px;
    }



  </style>
</head>
<body>

  
  <button id="timerBtn" aria-label="Timer" role="button">8</button>
  <div class="nebula"></div>
  <div class="shimmer"></div>

  <div class="core">

    <!-- Logo + Title -->
    <img class="logo" src="PulseWorldSplash512.png" alt="PulseWorld Logo" />

    <div class="title">PulseBrowser OS</div>
    <div class="subtitle">
      Unified Internet • Temporal OS • Accelerated Routing • Immortal Runtime
    </div>

    <!-- Search Area -->
    <div class="search-area">

      <div class="search-row">
        <div id="searchengineTextbox"
             class="search-engine-textbox"
             contenteditable="true"
             role="textbox"
             aria-label="Search Engine TextBox"></div>
      </div>

      <div class="search-actions">
        <!-- Intent Icons -->
        <a class="navigate" id="navigate">🔗</a>
        <a class="images" id="images">🖼️</a>
        <a class="videos" id="videos">🎬</a>
        <a class="text" id="text">📄</a>
        <a class="search" id="search">🔍 Pulse Search Engine</a>
        <a class="searchus" id="searchus">Who We Are? 🧑</a>
      </div>

    </div>

    <!-- Main Navigation Buttons -->
    <div class="main-links">
      <a class="engage" id="engage" href="https://www.pulseworld.biz">💼 PulseBusiness</a>
      <a class="enter" id="enter" href="https://www.pulseworld.net">🌐 Enter PulseWorld</a>
      <a class="setup" id="setup" href="https://www.pulseworld.me">🧑‍🎨 PulseIdentity</a>
    </div>

    <!-- ⭐ PulseBrowser Modules Console -->
    <div class="module-console">

      <div class="module-title">PulseBrowser Modules</div>

      <div class="module-row">

        <a class="module-btn" id="moduleBank">
          <span class="module-icon" id="moduleBankIcon">🏦</span>
          <span class="module-label">Banking</span>
        </a>

        <a class="module-btn" id="moduleEmail">
          <span class="module-icon" id="moduleEmailIcon">📧</span>
          <span class="module-label">Email</span>
        </a>

        <a class="module-btn" id="moduleFav1">
          <span class="module-icon" id="moduleFav1Icon">⭐</span>
          <span class="module-label">Favorite 1</span>
        </a>

        <a class="module-btn" id="moduleFav2">
          <span class="module-icon" id="moduleFav2Icon">⭐</span>
          <span class="module-label">Favorite 2</span>
        </a>


      </div>

    </div>


  </div>

  <script src="PBFrontpage.js"></script>
  <script src="PBSettings.js"></script>

</body>
